# Pages CMS editor config. Generated by labs/class-pages/src/make_pages_cms.py — edit that, not this.
content:
  - name: "semester"
    label: "This semester's pages"
    type: "file"
    path: "site.json"
    format: "json"
    fields:
      - name: "current"
        label: "This semester"
        type: "object"
        fields:
          - name: "term"
            label: "Semester"
            type: "string"
            description: "e.g. Spring 2027"
            required: true
          - name: "schedule"
            label: "Days (short)"
            type: "string"
            description: "e.g. TR or MWF"
          - name: "scheduleLong"
            label: "Days (written out)"
            type: "string"
            description: "e.g. Tuesday & Thursday"
          - name: "id"
            label: "Folder name"
            type: "string"
            description: "Set when the semester starts. Leave as is."
            readonly: true
          - name: "sections"
            label: "Sections"
            type: "object"
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            fields:
              - name: "title"
                label: "Section name"
                type: "string"
                required: true
              - name: "titleEs"
                label: "Name in Spanish"
                type: "string"
              - name: "id"
                label: "Short name"
                type: "string"
                description: "Lowercase, dashes, e.g. oral-final."
                required: true
                pattern:
                  regex: "^[a-z0-9-]+$"
                  message: "Lowercase letters, numbers and dashes"
              - name: "when"
                label: "When"
                type: "object"
                fields:
                  - name: "month"
                    label: "Month"
                    type: "string"
                    description: "e.g. Nov"
                  - name: "days"
                    label: "Days"
                    type: "string"
                    description: "e.g. 17 · 19"
              - name: "items"
                label: "Pages in this section"
                type: "object"
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.title}"
                fields:
                  - name: "title"
                    label: "Page name"
                    type: "string"
                    required: true
                  - name: "path"
                    label: "File"
                    type: "string"
                    description: "Where the page sits inside this term's folder, e.g. oral-final/topic-draw.html"
                    required: true
                  - name: "kind"
                    label: "Type"
                    type: "select"
                    default: "Page"
                    options:
                      values:
                        - "Page"
                        - "Tool"
                        - "Guide"
                        - "Practice"
                        - "Slides"
                        - "Video"
                  - name: "audience"
                    label: "Who it's for"
                    type: "select"
                    options:
                      values:
                        - name: "students"
                          label: "Students"
                        - name: "instructor"
                          label: "Instructor (marked as such)"
                      placeholder: "Students"
                  - name: "desc"
                    label: "One-line description"
                    type: "text"
                    options:
                      maxlength: 200
  - name: "course"
    label: "Course name"
    type: "file"
    path: "site.json"
    format: "json"
    fields:
      - name: "course"
        label: "Course"
        type: "object"
        fields:
          - name: "code"
            label: "Course code"
            type: "string"
            required: true
          - name: "title"
            label: "Course title"
            type: "string"
            required: true
          - name: "titleEs"
            label: "Title in Spanish"
            type: "string"
          - name: "institution"
            label: "School"
            type: "string"
  - name: "new-semester"
    label: "Start a new semester"
    type: "file"
    path: "admin/new-semester.json"
    format: "json"
    fields:
      - name: "season"
        label: "Season"
        type: "select"
        required: true
        options:
          values:
            - name: "spring"
              label: "Spring"
            - name: "summer"
              label: "Summer"
            - name: "fall"
              label: "Fall"
      - name: "year"
        label: "Year"
        type: "number"
        required: true
        options:
          min: 2026
          max: 2040
      - name: "schedule"
        label: "Class days"
        type: "select"
        required: true
        options:
          values:
            - name: "tr"
              label: "Tuesday & Thursday"
            - name: "mwf"
              label: "Monday, Wednesday & Friday"
            - name: "mw"
              label: "Monday & Wednesday"
            - name: "online"
              label: "Online"
      - name: "start"
        label: "Start it now?"
        type: "boolean"
        description: "Turn on and save. This semester's pages move to the archive and an empty new semester begins. Takes about a minute."
        default: false
settings:
  content:
    merge: true
